name: RUSA-AI Local Durable Queue CI

on:
  pull_request:
    paths:
      - "llm-project/orchestrator/**"
      - "llm-project/tests/test_local_queue.py"
      - ".github/workflows/rusa-local-queue-ci.yml"

permissions:
  contents: read

jobs:
  local-queue-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile queue source
        run: python -m py_compile llm-project/orchestrator/local_queue.py
      - name: Run durable queue tests
        run: python -m unittest discover -s llm-project/tests -p "test_local_queue.py" -v
