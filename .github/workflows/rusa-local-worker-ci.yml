name: RUSA-AI Local Worker and A2A CI

on:
  push:
    branches:
      - feat/rusa-local-model-worker-v1
      - feat/rusa-a2a-local-queue-bridge-v1
    paths:
      - "llm-project/orchestrator/**"
      - "llm-project/tests/test_local_worker.py"
      - "llm-project/tests/test_a2a_ingress.py"
      - ".github/workflows/rusa-local-worker-ci.yml"
  pull_request:
    paths:
      - "llm-project/orchestrator/**"
      - "llm-project/tests/test_local_worker.py"
      - "llm-project/tests/test_a2a_ingress.py"
      - ".github/workflows/rusa-local-worker-ci.yml"

permissions:
  contents: read

jobs:
  local-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile local runtime modules
        run: |
          python -m py_compile llm-project/orchestrator/local_queue.py
          python -m py_compile llm-project/orchestrator/worker.py
          python -m py_compile llm-project/orchestrator/a2a_ingress.py
      - name: Run durable queue tests
        run: python -m unittest discover -s llm-project/tests -p "test_local_queue.py" -v
      - name: Run local worker tests
        run: python -m unittest discover -s llm-project/tests -p "test_local_worker.py" -v
      - name: Run A2A ingress and end-to-end tests
        run: python -m unittest discover -s llm-project/tests -p "test_a2a_ingress.py" -v
